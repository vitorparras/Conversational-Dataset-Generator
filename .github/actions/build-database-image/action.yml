name: Dar a imagem do banco de teste
description: >-
  Entrega pelo nome em TEST_DATABASE_IMAGE a imagem de tools/database, para que os projetos de teste a usem sem construí-la cada um.
  A imagem tem como etiqueta o hash dos arquivos que a definem e vive no GHCR: se a etiqueta existe, o job só a baixa; se não, constrói
  aqui e, só com `publish: true`, a publica. Sem login (pull request de fork) constrói local. O login some ao fim do passo, antes de o
  job rodar código do pull request. Se a construção cai, cai aqui, com o log dela e, no resumo do job, as linhas `E:` do apt.

inputs:
  token:
    description: Token com permissão de ler pacotes do repositório (e de escrevê-los, se `publish`).
    default: ${{ github.token }}
  publish:
    description: >-
      `true` só no job que roda no main e tem `packages: write`: publica a imagem que construiu. Em pull request e no build remoto fica `false`.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Baixar a imagem desta versão do banco ou construí-la com o log inteiro
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        PUBLISH: ${{ inputs.publish }}
      run: python3 tools/verify-code/database_image.py --provide "$GITHUB_REPOSITORY"
