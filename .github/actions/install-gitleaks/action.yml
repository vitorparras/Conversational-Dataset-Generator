name: Instalar gitleaks
description: Baixa o gitleaks na versão fixada; o passo secrets confere a soma SHA-256 do binário antes de rodá-lo.

runs:
  using: composite
  steps:
    - name: Baixar e extrair o binário
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/gitleaks"
        curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
          | tar -xz -C "$RUNNER_TEMP/gitleaks" gitleaks
        echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
