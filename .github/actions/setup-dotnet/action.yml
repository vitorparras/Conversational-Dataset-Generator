name: Instalar o SDK do .NET da global.json
description: >-
  Chama o actions/setup-dotnet e, se o download do SDK cair, chama de novo depois de uma espera que cresce (20 s e 60 s), no máximo três
  tentativas. Cada queda vai ao resumo do job (#733); o código HTTP da queda está no log do passo que caiu.

runs:
  using: composite
  steps:
    - id: first
      continue-on-error: true
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: global.json
    - id: wait-first
      if: steps.first.outcome == 'failure'
      shell: bash
      run: |
        {
          echo '### Download que caiu: SDK do .NET (actions/setup-dotnet, versão da global.json)'
          echo
          echo '- URL: a que o passo anterior imprimiu (builds.dotnet.microsoft.com ou dot.net); o código HTTP está no log dele'
          echo '- tentativas: 1 de 3; nova tentativa em 20 s'
        } >> "$GITHUB_STEP_SUMMARY"
        sleep 20
    - id: second
      if: steps.first.outcome == 'failure'
      continue-on-error: true
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: global.json
    - id: wait-second
      if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure'
      shell: bash
      run: |
        {
          echo '### Download que caiu: SDK do .NET (actions/setup-dotnet, versão da global.json)'
          echo
          echo '- URL: a que o passo anterior imprimiu (builds.dotnet.microsoft.com ou dot.net); o código HTTP está no log dele'
          echo '- tentativas: 2 de 3; nova tentativa em 60 s'
        } >> "$GITHUB_STEP_SUMMARY"
        sleep 60
    - if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure'
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: global.json
