version: 2
updates:
  - package-ecosystem: nuget
    directory: /core
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      nuget:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: uv
    directory: /language-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      uv:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
