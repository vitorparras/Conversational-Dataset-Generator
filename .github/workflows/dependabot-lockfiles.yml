name: Regenera locks do Dependabot

on:
  pull_request:
    paths: ['core/Directory.Packages.props']

permissions:
  contents: read

jobs:
  lockfiles:
    name: Regenerar packages.lock.json na branch do Dependabot
    if: github.actor == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/nuget/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Reavaliar as dependências e gravar os locks
        run: dotnet restore core/Core.slnx --force-evaluate
      - name: Commitar os locks alterados na própria branch
        run: |
          if git diff --quiet -- 'core/**/packages.lock.json'; then
            echo "Locks já estavam em dia."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'core/**/packages.lock.json'
          git commit -m "build(deps): regenera packages.lock.json"
          git push
