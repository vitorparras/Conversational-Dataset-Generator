name: Repete o teste instável (temporário, sai antes do merge)

# Prova da issue #562: ServiceErrorTailTests e o teste do pipe quebrado rodam 15 vezes seguidas na CI. Este arquivo existe só na branch
# fix/562-pipe-quebrado e é removido antes do merge.
on:
  push:
    branches: [fix/562-pipe-quebrado]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  pipe-quebrado:
    name: 15 repetições de ServiceErrorTailTests e RunningServiceBrokenPipeTests (#562)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r tools/verify-code/lint-requirements.txt -r tools/verify-code/service-requirements.txt
      - run: dotnet build core/tests/Core.Host.Tests/Core.Host.Tests.csproj --nologo
      - name: Repetir as duas classes 15 vezes
        run: |
          for i in $(seq 1 15); do
            echo "::group::repetição $i de 15"
            dotnet test core/tests/Core.Host.Tests/Core.Host.Tests.csproj --no-build \
              --filter-class "Core.Host.Tests.Supervision.ServiceErrorTailTests" \
              --filter-class "Core.Host.Tests.Supervision.RunningServiceBrokenPipeTests" || { echo "::error::reprovou na repetição $i"; exit 1; }
            echo "::endgroup::"
          done
