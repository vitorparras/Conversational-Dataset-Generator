name: Repete o teste instável da entrada (temporário, sai antes do merge)

# Prova da issue #566: SessionEntryTimingTests roda 15 vezes seguidas na CI com a máquina ocupada (um laço de CPU por núcleo, como a solução inteira em paralelo).
# O job "antes" roda o teste como está no main e só conta as reprovações com os tempos medidos; o job "depois" roda o da branch e tem de passar nas 15.
# Este arquivo existe só na branch fix/562-pipe-quebrado e é removido antes do merge.
on:
  push:
    branches: [fix/562-pipe-quebrado]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  antes:
    name: 15 repetições do teste do main, com a solução ao lado (só conta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: O teste como está no main
        run: git show origin/main:core/tests/Core.Tests.Integration/Sessions/SessionEntryTimingTests.cs > core/tests/Core.Tests.Integration/Sessions/SessionEntryTimingTests.cs
      - run: dotnet build core/Core.slnx --nologo
      - name: Repetir 15 vezes com o resto da solução rodando ao lado
        run: |
          (while :; do dotnet test core/Core.slnx --no-build --filter-not-class "Core.Tests.Integration.Sessions.SessionEntryTimingTests" >/dev/null 2>&1; done) &
          failures=0
          for i in $(seq 1 15); do
            echo "::group::repetição $i de 15"
            dotnet test core/tests/Core.Tests.Integration/Core.Tests.Integration.csproj --no-build \
              --filter-class "Core.Tests.Integration.Sessions.SessionEntryTimingTests" 2>&1 | tee run.log || { failures=$((failures + 1)); grep -E "A name nobody goes by took|The derivation is not most" run.log | head -2; }
            echo "::endgroup::"
          done
          echo "reprovações do teste do main: $failures de 15"
          kill $(jobs -p) || true

  depois:
    name: 15 repetições do teste da branch, com a solução ao lado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet build core/Core.slnx --nologo
      - name: Repetir 15 vezes com o resto da solução rodando ao lado
        run: |
          (while :; do dotnet test core/Core.slnx --no-build --filter-not-class "Core.Tests.Integration.Sessions.SessionEntryTimingTests" >/dev/null 2>&1; done) &
          for i in $(seq 1 15); do
            echo "::group::repetição $i de 15"
            dotnet test core/tests/Core.Tests.Integration/Core.Tests.Integration.csproj --no-build \
              --filter-class "Core.Tests.Integration.Sessions.SessionEntryTimingTests" || { echo "::error::reprovou na repetição $i"; exit 1; }
            echo "::endgroup::"
          done
          kill $(jobs -p) || true
