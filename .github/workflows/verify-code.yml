name: Verifica código

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

# Same script, same step order as `verify.py --list`; a test in tools/verify-code/tests checks it.
jobs:
  dotnet:
    name: Núcleo (.NET) e ferramentas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Instalar ruff e pyright nas versões fixadas
        run: pip install -r tools/verify-code/lint-requirements.txt
      - name: Construir, testar e formatar o núcleo; verificar e testar as ferramentas
        run: python tools/verify-code/verify.py --step build_core test_core format_core lint_tools test_tools

  pr_size:
    name: Teto do pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Medir o diff de produção contra a base do pull request
        run: python tools/verify-code/verify.py --step pr_size --base origin/${{ github.base_ref }}
