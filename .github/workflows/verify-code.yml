name: Verifica código

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  prova:
    name: Prova ${{ matrix.module }} (execução ${{ matrix.rodada }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        rodada: [1, 2, 3]
        module: ['Core.Persistence.Content@1/5', 'Core.Persistence.Content@2/5', 'Core.Persistence.Content@3/5', 'Core.Persistence.Content@4/5', 'Core.Persistence.Content@5/5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r tools/verify-code/service-requirements.txt
      - name: Mutar
        env:
          MODULE: ${{ matrix.module }}
        run: python tools/verify-code/verify.py --step mutation --module "$MODULE"
      - name: Guardar o relatório do Stryker
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prova-${{ strategy.job-index }}
          path: .verify-code/mutation/core/*/reports
          include-hidden-files: true
          overwrite: true
