name: Verifica código

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

# Same script, same step order as `verify.py --list`; a test in tools/verify-code/tests checks it.
jobs:
  dotnet:
    name: Núcleo (.NET) e ferramentas
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/install-gitleaks
      - name: Instalar ruff, pyright e coverage nas versões fixadas (sem uv: test_core não sobe o serviço real)
        run: pip install -r tools/verify-code/lint-requirements.txt
      - name: Construir, testar e formatar o núcleo; verificar e testar as ferramentas
        run: python tools/verify-code/verify.py --step build_core test_core format_core lint_tools test_tools coverage floors

  real_service:
    name: Núcleo com o serviço real (.NET e uv)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Instalar uv na versão fixada (os testes chamam `uv run --frozen`)
        run: pip install -r tools/verify-code/service-requirements.txt
      - name: Construir o núcleo e rodar só os testes que sobem o serviço real, listando os pulados
        run: python tools/verify-code/verify.py --step build_core test_real_service

  python:
    name: Serviço de linguagem (Python)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Instalar uv, ruff, pyright e coverage nas versões fixadas
        run: pip install -r tools/verify-code/service-requirements.txt -r tools/verify-code/lint-requirements.txt
      - name: Sincronizar, testar e verificar o serviço de linguagem
        run: python tools/verify-code/verify.py --step build_service test_service coverage floors lint_service

  properties:
    name: Propriedades nas duas linguagens
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Instalar uv na versão fixada
        run: pip install -r tools/verify-code/service-requirements.txt
      - name: Exigir que o núcleo e o serviço executem propriedades
        run: python tools/verify-code/verify.py --step properties

  package:
    name: Construção reproduzível (duas cópias limpas)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Publicar cada alvo duas vezes, cada uma de um clone do commit, e comparar os bytes
        run: python tools/verify-code/verify.py --step package
      - name: Repetir sem rede, só com os pacotes já baixados e o cache HTTP do NuGet vazio
        env:
          NUGET_HTTP_CACHE_PATH: ${{ runner.temp }}/nuget-http-cache-vazio
        # Both spellings go in the script: `env` keys are case-insensitive for GitHub, so declaring both is a workflow-file error.
        run: |
          export HTTPS_PROXY=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9
          export HTTP_PROXY=http://127.0.0.1:9 http_proxy=http://127.0.0.1:9
          export NO_PROXY='' no_proxy=''
          python tools/verify-code/verify.py --step package

  service_folder:
    name: Pasta do serviço reproduzível (linux-x64)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Instalar uv na versão fixada
        run: pip install -r tools/verify-code/service-requirements.txt
      - name: Montar a pasta em duas cópias limpas, a segunda sem rede, e comparar byte a byte
        run: python tools/build-service/reproduce.py --system linux-x64 --model pt_core_news_md

  mutation_modules:
    name: Módulos críticos da mutação
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - id: list
        name: Ler os módulos críticos de docs/operacao/014 (a matriz não tem lista própria)
        run: |
          modules=$(python tools/verify-code/verify.py --mutation-modules)
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  mutation_module:
    name: Mutação (${{ matrix.module }})
    needs: mutation_modules
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # The step cuts the module at the ceiling of docs/operacao/017; the rest is setup and restore.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.mutation_modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Instalar uv na versão fixada (o mutmut vem de language-service/uv.lock)
        run: pip install -r tools/verify-code/service-requirements.txt
      - name: Mutar o módulo crítico da matriz (Stryker.NET ou mutmut, um worker)
        env:
          MODULE: ${{ matrix.module }}
        run: python tools/verify-code/verify.py --step mutation --module "$MODULE"

  # Aggregates the matrix under the name the check always had, so nothing that waits for it changes.
  mutation:
    name: Mutação nos módulos críticos
    needs: [mutation_modules, mutation_module]
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Exigir a lista e todos os módulos da matriz verdes
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "resultados: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

  ruler_proof:
    name: Prova de que a régua reprova o que deve recusar
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Instalar uv na versão fixada
        run: pip install -r tools/verify-code/service-requirements.txt
      - name: Semear uma propriedade falsa e um defeito crítico numa cópia descartável e exigir a recusa
        run: python tools/verify-code/verify.py --step ruler_proof

  dependencies:
    name: Dependências vulneráveis nas duas árvores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Instalar uv e pip-audit nas versões fixadas
        run: pip install -r tools/verify-code/service-requirements.txt -r tools/verify-code/audit-requirements.txt
      - name: Auditar a árvore completa do núcleo e do serviço, também na execução semanal
        run: python tools/verify-code/verify.py --step dependencies

  secrets:
    name: Segredos no histórico (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/install-gitleaks
      - name: Varrer o diff do pull request, ou o histórico inteiro fora dele
        run: python tools/verify-code/verify.py --step secrets ${{ github.event_name == 'pull_request' && format('--base origin/{0}', github.base_ref) || '' }}

  trivy:
    name: Dependências, segredos e configuração (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/install-trivy
      - name: Guardar o banco de vulnerabilidades entre execuções
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - name: Varrer o repositório e reprovar HIGH e CRITICAL sem risco aceito
        run: python tools/verify-code/verify.py --step trivy

  static_analysis:
    name: Análise estática de segurança (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Instalar o semgrep na versão fixada
        run: pip install -r tools/verify-code/static-analysis-requirements.txt
      - name: Reprovar o que as regras próprias acusarem no núcleo, no serviço e nas ferramentas
        run: python tools/verify-code/verify.py --step static_analysis

  pr_size:
    name: Teto do pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Medir o diff de produção contra a base do pull request
        run: python tools/verify-code/verify.py --step pr_size --base origin/${{ github.base_ref }}

  ai_attribution:
    name: Commits sem atribuição a IA
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Reprovar commit do pull request que credita um assistente de IA
        run: python tools/verify-code/verify.py --step ai_attribution --base origin/${{ github.base_ref }}
