name: Verifica código

# While a pull request is a draft, the five slowest jobs (package, offline_start, service_folder,
# mutation_modules and its matrix) are skipped, and the aggregator `mutation` reports green with them
# skipped. A skipped job counts as green for the ruleset, which is safe: a draft is not merged, and
# `ready_for_review` starts a run of the whole ruler on the same head. Push and schedule have no
# draft, so nothing changes for them.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

# A new push to a pull request cancels the run still going for the same PR; main and the schedule
# have a group of their own per run (run_id), so they are never cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

# Same script, same step order as `verify.py --list`; a test in tools/verify-code/tests checks it.
jobs:
  # Decides if the heavy jobs run (steps/changes.py, steps/tested_tree.py): they run unless the diff
  # is documents no code reads, or a green PR run recorded the tree of the push. Any error runs them.
  changes:
    name: Classificar o diff (jobs pesados do código)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
      tested_run: ${{ steps.classify.outputs.tested_run }}
      tested_head: ${{ steps.classify.outputs.tested_head }}
      promote: ${{ steps.classify.outputs.promote }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - id: tree
        name: Registrar a árvore do merge ref que este pull request testa, para o push do main reconhecê-la
        if: github.event_name == 'pull_request'
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$tree $GITHUB_SHA" > "$RUNNER_TEMP/arvore.txt"
      - name: Guardar a árvore registrada
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arvore-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/arvore.txt
          overwrite: true
      - id: classify
        name: Dispensar os jobs pesados só se o diff do pull request for documento que nenhum código lê
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          TESTED_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/verify-code/verify.py --changes ${BASE:+--base "$BASE"} \
            ${TESTED_SHA:+--tested-sha "$TESTED_SHA" --repository "$GITHUB_REPOSITORY"} >> "$GITHUB_OUTPUT"

  dotnet:
    name: Núcleo (.NET) e ferramentas
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.heavy != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/install-gitleaks
      - name: Instalar ruff, pyright e coverage nas versões fixadas (ainda sem uv no PATH)
        run: python3 tools/verify-code/retry.py -- pip install -r tools/verify-code/lint-requirements.txt
      - uses: ./.github/actions/build-database-image
      - name: Construir e testar o núcleo sem o serviço real, e sem uv no PATH
        run: python tools/verify-code/verify.py --step build_core test_core
      - name: Instalar uv na versão fixada (test_real_service chama `uv run --frozen`)
        run: python3 tools/verify-code/retry.py -- pip install -r tools/verify-code/service-requirements.txt
      - name: Sincronizar o ambiente do serviço (o modelo do spaCy vem do GitHub; só baixar repete, nunca o pytest)
        run: python3 tools/verify-code/retry.py -- uv sync --locked --directory language-service
      - name: 'Restaurar a cobertura por área que o main guardou (cache vazio: o passo compara sem ela)'
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cobertura-main
          key: cobertura-dotnet-${{ github.sha }}
          restore-keys: cobertura-dotnet-
      - name: Testar com o serviço real, formatar, verificar as ferramentas e medir a cobertura das duas suítes juntas
        run: |
          previous=()
          if [ -f "$RUNNER_TEMP/cobertura-main/by-area.md" ]; then
            previous=(--previous "$RUNNER_TEMP/cobertura-main/by-area.md")
          fi
          python tools/verify-code/verify.py "${previous[@]}" --step test_real_service format_core lint_tools test_tools coverage floors
      - name: Guardar o by-area.md do pull request, que o main promove sem medir de novo
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-pr-dotnet-${{ github.event.pull_request.head.sha }}
          path: .verify-code/coverage/by-area.md
          retention-days: 30
          overwrite: true
          if-no-files-found: error
      - name: Separar o by-area.md medido no main
        if: github.event_name == 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/cobertura-main"
          cp .verify-code/coverage/by-area.md "$RUNNER_TEMP/cobertura-main/by-area.md"
      - name: Guardar em cache a cobertura por área do main, que o pull request restaura
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cobertura-main
          key: cobertura-dotnet-${{ github.sha }}
      - name: Guardar como artefato o número medido no main
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-dotnet-${{ github.sha }}
          path: .verify-code/coverage/by-area.md
          retention-days: 90
          if-no-files-found: error

  python:
    name: Serviço de linguagem (Python)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.heavy != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Instalar uv, ruff, pyright e coverage nas versões fixadas
        run: python3 tools/verify-code/retry.py -- pip install -r tools/verify-code/service-requirements.txt -r tools/verify-code/lint-requirements.txt
      - name: 'Restaurar a cobertura por área que o main guardou (cache vazio: o passo compara sem ela)'
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cobertura-main
          key: cobertura-python-${{ github.sha }}
          restore-keys: cobertura-python-
      - name: Sincronizar, testar e verificar o serviço de linguagem
        run: |
          previous=()
          if [ -f "$RUNNER_TEMP/cobertura-main/by-area.md" ]; then
            previous=(--previous "$RUNNER_TEMP/cobertura-main/by-area.md")
          fi
          python tools/verify-code/verify.py "${previous[@]}" --step build_service test_service coverage floors lint_service
      - name: Guardar o by-area.md do pull request, que o main promove sem medir de novo
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-pr-python-${{ github.event.pull_request.head.sha }}
          path: .verify-code/coverage/by-area.md
          retention-days: 30
          overwrite: true
          if-no-files-found: error
      - name: Separar o by-area.md medido no main
        if: github.event_name == 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/cobertura-main"
          cp .verify-code/coverage/by-area.md "$RUNNER_TEMP/cobertura-main/by-area.md"
      - name: Guardar em cache a cobertura por área do main, que o pull request restaura
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cobertura-main
          key: cobertura-python-${{ github.sha }}
      - name: Guardar como artefato o número medido no main
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-python-${{ github.sha }}
          path: .verify-code/coverage/by-area.md
          retention-days: 90
          if-no-files-found: error

  # A tree a green pull request tested is not measured again: its coverage tables become the main's.
  promote_coverage:
    name: Promover a cobertura por área (${{ matrix.language }})
    needs: changes
    if: ${{ github.event_name == 'push' && needs.changes.outputs.tested_run != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [dotnet, python]
    steps:
      - name: Baixar o by-area.md que o pull request guardou
        if: contains(needs.changes.outputs.promote, matrix.language)
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: cobertura-pr-${{ matrix.language }}-${{ needs.changes.outputs.tested_head }}
          RUN: ${{ needs.changes.outputs.tested_run }}
        run: python3 tools/verify-code/retry.py -- gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n "$NAME" -D "$RUNNER_TEMP/cobertura-main"
      - name: Guardar em cache a cobertura por área do main, que o pull request restaura
        if: contains(needs.changes.outputs.promote, matrix.language)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cobertura-main
          key: cobertura-${{ matrix.language }}-${{ github.sha }}
      - name: Guardar como artefato o número medido no pull request
        if: contains(needs.changes.outputs.promote, matrix.language)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-${{ matrix.language }}-${{ github.sha }}
          path: ${{ runner.temp }}/cobertura-main/by-area.md
          retention-days: 90
          if-no-files-found: error

  properties:
    name: Propriedades nas duas linguagens
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.heavy != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Instalar uv na versão fixada
        run: python3 tools/verify-code/retry.py -- pip install -r tools/verify-code/service-requirements.txt
      - name: Sincronizar o ambiente do serviço (o modelo do spaCy vem do GitHub; só baixar repete, nunca o pytest)
        run: python3 tools/verify-code/retry.py -- uv sync --locked --directory language-service
      - uses: ./.github/actions/build-database-image
      - name: Exigir que o núcleo e o serviço executem propriedades
        run: python tools/verify-code/verify.py --step properties

  # The screens in a real Chromium, over the host on a real Kestrel and the test database. The solution's test step does not run this project
  # (it is no test project of the solution): this is the only place it runs, so a failing browser test fails this job.
  browser:
    name: Navegador (Playwright)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.heavy != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Construir o projeto de navegador nos pacotes travados (as versões do Playwright e do axe estão em core/Directory.Packages.props)
        run: |
          echo "inicio=$(date +%s)" >> "$GITHUB_ENV"
          python3 tools/verify-code/retry.py -- dotnet restore core/tests/Core.Host.Tests.Browser/Core.Host.Tests.Browser.csproj --locked-mode
          dotnet build core/tests/Core.Host.Tests.Browser/Core.Host.Tests.Browser.csproj -c Release --no-restore
      - name: Instalar o Chromium da versão que o pacote fixa, sem latest e sem outro navegador
        run: python3 tools/verify-code/retry.py -- pwsh core/tests/Core.Host.Tests.Browser/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - uses: ./.github/actions/build-database-image
      - name: Rodar os testes de navegador
        run: dotnet run --project core/tests/Core.Host.Tests.Browser/Core.Host.Tests.Browser.csproj -c Release --no-build
      - name: Anotar o tempo do job
        if: always()
        run: echo "Tempo do job de navegador (construir, instalar o Chromium e testar) - $(( $(date +%s) - inicio )) s" >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Construção reproduzível (duas cópias limpas)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.heavy != 'false' && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Publicar cada alvo duas vezes, cada uma de um clone do commit, e comparar os bytes
        run: python tools/verify-code/verify.py --step package
      - name: Repetir sem rede, só com os pacotes já baixados e o cache HTTP do NuGet vazio
        env:
          NUGET_HTTP_CACHE_PATH: ${{ runner.temp }}/nuget-http-cache-vazio
        # Both spellings go in the script: `env` keys are case-insensitive for GitHub, so declaring both is a workflow-file error.
        run: |
          export HTTPS_PROXY=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9
          export HTTP_PROXY=http://127.0.0.1:9 http_proxy=http://127.0.0.1:9
          export NO_PROXY='' no_proxy=''
          python tools/verify-code/verify.py --step package

  offline_start:
    name: Partida sem rota de rede (contêineres, strace)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.heavy != 'false' && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Montar a pasta do serviço com rede, subir banco e núcleo só com o loopback, exigir a linha de pronto no prazo e reprovar conexão externa e consulta de DNS
        run: python tools/verify-code/verify.py --step offline_start

  service_folder:
    name: Pasta do serviço reproduzível (linux-x64)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.heavy != 'false' && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Instalar uv na versão fixada
        run: python3 tools/verify-code/retry.py -- pip install -r tools/verify-code/service-requirements.txt
      - name: Montar a pasta em duas cópias limpas, a segunda sem rede, e comparar byte a byte
        run: python tools/build-service/reproduce.py --system linux-x64 --model pt_core_news_md

  mutation_modules:
    name: Módulos críticos da mutação
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.heavy != 'false' && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - id: list
        name: Ler os módulos críticos que o diff alcança (todos fora de pull request ou na dúvida)
        env:
          BASE: ${{ github.event_name == 'pull_request' && needs.changes.result == 'success' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          modules=$(python tools/verify-code/verify.py --mutation-modules ${BASE:+--base "$BASE"} 2> "$RUNNER_TEMP/alcance.md")
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          { echo "### Mutação: módulos alcançados e o motivo de cada um"; cat "$RUNNER_TEMP/alcance.md"; } >> "$GITHUB_STEP_SUMMARY"

  mutation_module:
    name: Mutação (${{ matrix.module }})
    needs: mutation_modules
    if: needs.mutation_modules.outputs.modules != '[]' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # The step cuts the module at the ceiling of docs/operacao/017; the rest is setup and restore.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.mutation_modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Instalar uv na versão fixada (o mutmut vem de language-service/uv.lock)
        run: python3 tools/verify-code/retry.py -- pip install -r tools/verify-code/service-requirements.txt
      - name: Sincronizar o ambiente do serviço (o modelo do spaCy vem do GitHub; só baixar repete, nunca o pytest)
        run: python3 tools/verify-code/retry.py -- uv sync --locked --directory language-service
      - name: Mutar o módulo crítico da matriz (Stryker.NET ou mutmut, um worker)
        env:
          MODULE: ${{ matrix.module }}
        run: python tools/verify-code/verify.py --step mutation --module "$MODULE"
      - id: log
        name: Dar ao artefato do log um nome sem barra nem arroba
        if: failure()
        env:
          MODULE: ${{ matrix.module }}
        run: echo "name=log-da-mutacao-$(echo "$MODULE" | tr '/@' '--')-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Guardar o log do Stryker e o do host de teste quando o passo reprova
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.log.outputs.name }}
          path: |
            .verify-code/mutation/core/*/logs
            .verify-code/mutation/core/*/stryker-config.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

  # Aggregates the matrix under the name the check always had. It always reports: everything skipped
  # when the classification dispensed it or the pull request is a draft, an empty matrix when the list
  # declared that no module is reached, green otherwise (a failed classification or list is a failure).
  mutation:
    name: Mutação nos módulos críticos
    needs: [changes, mutation_modules, mutation_module]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Exigir a lista e os módulos alcançados verdes, ou dispensados quando o alcance diz que não há
        env:
          CLASSIFICATION: ${{ needs.changes.result }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          LISTED: ${{ needs.mutation_modules.result }}
          MODULES: ${{ needs.mutation_modules.outputs.modules }}
          MATRIX: ${{ needs.mutation_module.result }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          echo "classificação: $CLASSIFICATION, heavy=$HEAVY, rascunho: $DRAFT, lista: $LISTED, módulos: $MODULES, matriz: $MATRIX"
          list=success
          matrix=success
          if [ "$CLASSIFICATION" = success ] && { [ "$HEAVY" = false ] || [ "$DRAFT" = true ]; }; then
            list=skipped
            matrix=skipped
          elif [ "$CLASSIFICATION" = success ] && [ "$LISTED" = success ] && [ "$MODULES" = '[]' ]; then
            matrix=skipped
          fi
          [ "$LISTED" = "$list" ] && [ "$MATRIX" = "$matrix" ] || exit 1

  ruler_proof:
    name: Prova de que a régua reprova o que deve recusar
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.heavy != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Instalar uv na versão fixada
        run: python3 tools/verify-code/retry.py -- pip install -r tools/verify-code/service-requirements.txt
      - name: Sincronizar o ambiente do serviço (o modelo do spaCy vem do GitHub; só baixar repete, nunca o pytest)
        run: python3 tools/verify-code/retry.py -- uv sync --locked --directory language-service
      - name: Semear numa cópia descartável uma propriedade falsa, um defeito em módulo crítico, código sem teste e testes fracos, e exigir a recusa de cada um
        run: python tools/verify-code/verify.py --step ruler_proof

  dependencies:
    name: Dependências vulneráveis nas duas árvores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Instalar uv e pip-audit nas versões fixadas
        run: python3 tools/verify-code/retry.py -- pip install -r tools/verify-code/service-requirements.txt -r tools/verify-code/audit-requirements.txt
      - name: Auditar a árvore completa do núcleo e do serviço, também na execução semanal
        run: python tools/verify-code/verify.py --step dependencies

  secrets:
    name: Segredos no histórico (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/install-gitleaks
      # The push to main answers for the main alone: the clone holds every branch, and an old one
      # with a finding (#722) must not turn the main red. The schedule still reads them all.
      - name: Varrer o diff do pull request, o histórico do main no push e o de todas as branches fora deles
        run: python tools/verify-code/verify.py --step secrets ${{ github.event_name == 'pull_request' && format('--base origin/{0}', github.base_ref) || github.event_name == 'push' && '--head-only' || '' }}

  trivy:
    name: Dependências, segredos e configuração (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/install-trivy
      - name: Guardar o banco de vulnerabilidades entre execuções
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - name: Varrer o repositório e reprovar HIGH e CRITICAL sem risco aceito
        run: python tools/verify-code/verify.py --step trivy

  static_analysis:
    name: Análise estática de segurança (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Instalar o semgrep na versão fixada
        run: python3 tools/verify-code/retry.py -- pip install -r tools/verify-code/static-analysis-requirements.txt
      - name: Reprovar o que as regras próprias acusarem no núcleo, no serviço e nas ferramentas
        run: python tools/verify-code/verify.py --step static_analysis

  pr_size:
    name: Teto do pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Medir o diff de produção contra a base do pull request
        run: python tools/verify-code/verify.py --step pr_size --base origin/${{ github.base_ref }}

  ai_attribution:
    name: Commits sem atribuição a IA
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Reprovar commit do pull request que credita um assistente de IA
        run: python tools/verify-code/verify.py --step ai_attribution --base origin/${{ github.base_ref }}
