name: Verifica código

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  contagem:
    name: Contar as construções da imagem no test_core real (amostra ${{ matrix.amostra }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        amostra: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/install-gitleaks
      - run: pip install -r tools/verify-code/lint-requirements.txt
      - name: Ambiente do Docker
        run: |
          mkdir -p "$RUNNER_TEMP/m"
          { docker version; docker info; df -h /; cat /etc/os-release | head -3; nproc; free -m; } > "$RUNNER_TEMP/m/ambiente.txt" 2>&1 || true
      - name: Eventos de imagem do Docker durante o teste
        run: |
          nohup docker events --format '{{.TimeNano}} {{.Action}} {{.Actor.ID}} {{json .Actor.Attributes}}' --filter type=image > "$RUNNER_TEMP/m/eventos.txt" 2>&1 &
          echo $! > "$RUNNER_TEMP/m/events.pid"
      - name: Construir e testar o núcleo (como a CI)
        run: python tools/verify-code/verify.py --step build_core test_core
        continue-on-error: true
      - name: Fechar a captura
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/m/events.pid")" || true
          docker images --digests > "$RUNNER_TEMP/m/imagens.txt" 2>&1 || true
          date -u +%s%N > "$RUNNER_TEMP/m/fim.txt"
          sudo journalctl -u docker -u containerd --no-pager > "$RUNNER_TEMP/m/daemon.txt" 2>&1 || true
          sudo dmesg -T 2>&1 | tail -n 200 > "$RUNNER_TEMP/m/dmesg.txt" || true
          free -m > "$RUNNER_TEMP/m/memoria.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: contagem-${{ matrix.amostra }}
          path: ${{ runner.temp }}/m
          overwrite: true
