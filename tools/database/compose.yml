# Development database: the port is published on loopback only and every password comes from the
# environment; nothing secret lives in this repository.
name: cdg-database

services:
  database:
    build:
      context: .
      dockerfile: Dockerfile
    image: cdg-database:dev
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD (superusuário)}
      DATABASE_OWNER_PASSWORD: ${DATABASE_OWNER_PASSWORD:?defina DATABASE_OWNER_PASSWORD (papel owner)}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?defina DATABASE_APP_PASSWORD (papel app)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database-data:/var/lib/postgresql/data
      - database-log:/var/log/postgresql

volumes:
  database-data:
  database-log:
