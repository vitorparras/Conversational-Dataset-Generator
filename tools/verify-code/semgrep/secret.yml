rules:
  - id: secret-literal-python
    languages: [python]
    severity: ERROR
    message: >-
      Segredo escrito no código: leia-o do ambiente ou da entrada padrão na partida; em teste, use
      um marcador sintético ZQX-.
    metadata: {license: AGPL-3.0, family: secret}
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $NAME = "$VALUE"
                  - pattern: "$NAME: $TYPE = \"$VALUE\""
                  - pattern: $OBJ.$NAME = "$VALUE"
                  - pattern: $CALL(..., $NAME="$VALUE", ...)
                  - pattern: "{..., \"$NAME\": \"$VALUE\", ...}"
              - metavariable-regex:
                  metavariable: $NAME
                  regex: (?i).*(password|passwd|pwd|secret|token|api_?key|access_?key|private_?key|credentials?)$
          - patterns:
              - pattern: $NAME = "$VALUE"
              - metavariable-regex: {metavariable: $VALUE, regex: '(?i).*(password|pwd)='}
      - metavariable-regex: {metavariable: $VALUE, regex: '^(?!.*ZQX-)\S{8,}$'}
      - focus-metavariable: $VALUE
  - id: secret-literal-csharp
    languages: [csharp]
    severity: ERROR
    message: >-
      Segredo escrito no código: leia-o da configuração ou do ambiente na partida; em teste, use
      um marcador sintético ZQX-.
    metadata: {license: AGPL-3.0, family: secret}
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $TYPE $NAME = "$VALUE";
                  - pattern: var $NAME = "$VALUE";
                  - pattern: $NAME = "$VALUE"
                  - pattern: "$CALL(..., $NAME: \"$VALUE\", ...)"
              - metavariable-regex: {metavariable: $NAME, regex: '(?i).*(password|passwd|pwd|secret|token|api_?key|access_?key|private_?key|credentials?)$'}
          - patterns:
              - pattern-either:
                  - pattern: $TYPE $NAME = "$VALUE";
                  - pattern: var $NAME = "$VALUE";
              - metavariable-regex: {metavariable: $VALUE, regex: '(?i).*(password|pwd)='}
      - metavariable-regex: {metavariable: $VALUE, regex: '^(?!.*ZQX-)\S{8,}$'}
      - focus-metavariable: $VALUE
